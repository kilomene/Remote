name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed for gh release create
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: bash packaging/deb/build-deb.sh

      - name: Build Android APK
        env:
          REMOTE_APK_OUT: ${{ github.workspace }}/out/remote-viewer.apk
          REMOTE_KEYSTORE: ${{ runner.temp }}/remote-viewer.keystore
        run: |
          # GitHub runners expose the Android SDK + JDK as shell env vars
          # (ANDROID_HOME / ANDROID_SDK_ROOT / JAVA_HOME_17_X64) — NOT as the
          # GitHub `env` context. build-apk.sh auto-detects them; just make
          # sure the JDK is preferred via REMOTE_JAVA_HOME.
          export REMOTE_JAVA_HOME="$JAVA_HOME_17_X64"
          bash android/build-apk.sh

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/remote_*_all.deb \
            out/remote-viewer.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
